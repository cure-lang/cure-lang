id = "cure"
name = "Cure"
version = "0.34.0"
schema_version = 1
description = "Official language support, LSP diagnostics, and MCP context server integration for Cure in Zed"
repository = "https://github.com/cure-lang/cure-lang"
authors = ["Cure Core Team <info@cure-lang.org>"]

[grammars.cure]
# The grammar lives in this repository under `tree-sitter-cure/`. `rev` must be
# a commit on the remote that contains it; bump it whenever the grammar changes.
repository = "https://github.com/cure-lang/cure-lang"
rev = "0f1a8bb170b07e80e695fdb3bf3e3f6e74400ce4"
path = "tree-sitter-cure"


[language_servers.cure-lsp]
name = "Cure LSP"
languages = ["Cure"]

[context_servers.cure-mcp]
name = "Cure MCP"
command = "cure"
args = ["mcp"]
