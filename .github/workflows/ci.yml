name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        elixir: ["1.20"]
        otp: ["27", "29"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install z3
        run: sudo apt-get install -y z3

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      # Cache the Dialyzer PLT directory separately from `_build`: the PLT is
      # expensive to rebuild (depends on every transitive app) and changes
      # when Elixir/OTP, the dependency graph, or the app version changes.
      # Including mix.exs in the hash ensures that a version bump (which
      # accompanies every sprint that adds new modules) busts the PLT cache
      # so `mix dialyzer --plt` rebuilds it with the new beam files included.
      # Without mix.exs in the key, a stale PLT is reused when only source
      # files change (mix.lock is unchanged), causing "Function X does not
      # exist" warnings for newly added modules.
      - name: Cache Dialyzer PLTs
        uses: actions/cache@v4
        with:
          path: .dialyzer
          key: ${{ runner.os }}-dialyzer-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.exs', 'mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}-
            ${{ runner.os }}-dialyzer-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Credo (strict)
        run: mix credo --strict

      # `--include slow` re-enables the `:slow` tests that `test_helper.exs`
      # excludes for local runs. CI must run the whole suite.
      - name: Run tests
        run: mix test --include slow

      # - name: Build Dialyzer PLTs
      #   run: mix dialyzer --plt

      # - name: Dialyzer
      #   run: mix dialyzer --format github

      - name: Compile Cure standard library
        run: mix cure.compile_stdlib

      - name: Cure stdlib regression check
        run: mix cure.check.stdlib

      - name: Cure examples regression check
        run: mix cure.check.examples

      - name: Cure regression checks (umbrella)
        run: mix cure.check
