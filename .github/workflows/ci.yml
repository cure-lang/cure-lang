name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test

jobs:
  test:
    name: Test (${{ matrix.os }} / Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The primary toolchain (both OSes) plus the DECLARED FLOOR from mix.exs
        # (`elixir: "~> 1.18"`). Without the floor entry the declared minimum was
        # never exercised, so a construct that needs 1.20 could ship unnoticed.
        # 1.18 suppressed due to formatting check failure, though
        os: [ubuntu-latest, macos-latest]
        elixir: ["1.20"]
        otp: ["29"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install z3 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y z3

      - name: Install z3 (macOS)
        if: runner.os == 'macOS'
        run: brew install z3

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      # Cache the Dialyzer PLT directory separately from `_build`: the PLT is
      # expensive to rebuild (depends on every transitive app) and changes
      # when Elixir/OTP, the dependency graph, or the app version changes.
      # Including mix.exs in the hash ensures that a version bump (which
      # accompanies every sprint that adds new modules) busts the PLT cache
      # so `mix dialyzer --plt` rebuilds it with the new beam files included.
      # Without mix.exs in the key, a stale PLT is reused when only source
      # files change (mix.lock is unchanged), causing "Function X does not
      # exist" warnings for newly added modules.
      - name: Cache Dialyzer PLTs
        uses: actions/cache@v4
        with:
          path: .dialyzer
          key: ${{ runner.os }}-dialyzer-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.exs', 'mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}-
            ${{ runner.os }}-dialyzer-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        if: runner.os == 'Linux'
        run: mix format --check-formatted

      - name: Credo (strict)
        if: runner.os == 'Linux'
        run: mix credo --strict

      # `--include slow` re-enables the `:slow` tests that `test_helper.exs`
      # excludes for local runs. `--include examples` re-enables the `:examples`
      # tests (the `examples/hello.cure` CLI smoke tests), which are likewise
      # excluded by default so a local `mix test` does not depend on the example
      # tree. CI must run the whole suite, so both are included here.
      - name: Run tests
        run: mix test --include slow --include examples

      # Coverage gate. `mix.exs` configures `minimum_coverage`, so this step
      # FAILS if line coverage drops below the configured floor. Linux only:
      # the number is platform-independent and the run is expensive.
      #
      # `--exclude cover_machinery` skips the Antigen tests that drive the
      # node-global `:cover` server directly: they call `:cover.stop/0`, which
      # tears down ExCoveralls' own session and makes the report read `0.0%`.
      # Those tests still run in the normal `mix test --include slow` step above.
      - name: Coverage gate
        if: runner.os == 'Linux'
        run: mix coveralls --exclude cover_machinery
      # Dialyzer runs on Linux only: the PLT is large and the analysis is
      # platform-independent, so there is no value in paying for it on both
      # runners. The PLT cache above is keyed on mix.exs/mix.lock so a version
      # bump or dependency change rebuilds it.
      - name: Build Dialyzer PLTs
        if: runner.os == 'Linux'
        run: mix dialyzer --plt

      - name: Dialyzer
        if: runner.os == 'Linux'
        run: mix dialyzer --format github
      - name: Compile Cure standard library
        run: mix cure.compile_stdlib

      - name: Cure stdlib regression check
        run: mix cure.check.stdlib

      - name: Cure examples regression check
        run: mix cure.check.examples

      - name: Cure regression checks (umbrella)
        run: mix cure.check

      # Compiles and tests every nested example project (examples/*/mix.exs
      # and examples/*/Cure.toml) with its own real toolchain invocation --
      # `mix test` for the Mix-based ones, `cure test` (via a freshly built
      # escript) for the pure-Cure ones such as `cure_calc` and
      # `cure_exchange/cure`.
      - name: Cure example projects regression check
        run: mix cure.check.projects
